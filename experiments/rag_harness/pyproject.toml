[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["E402"]
"**/scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["he_agent_v2", "he_agent", "models", "reference_split", "prompt_profiles"]
